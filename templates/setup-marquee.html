                                   placeholder="Texto que circulará"

                                <div class="cc-multi-btn"

                                     data-type="single-picker"

                                    <i class="cc-multi-btn-chevron" data-lucide="chevron-down"></i>

                                     data-json-key="fontWeight"
                                     data-tooltip="Peso"
                                     data-type="single-picker"
                                     id="mrc-font-weight">

                                    <i class="cc-multi-btn-chevron" data-lucide="chevron-down"></i>

                                <div class="cc-cp-preview"

                                     data-function="openColorPicker"
                                     data-i18n-tooltip="str125"
                                     data-json-key="color"
                                     data-tooltip="Color del texto"
                                     data-type="color"
                                     id="mrc-color-text">

                                <div class="cc-cp-preview"
                                     data-color="#000000"
                                     data-function="openColorPicker"
                                     data-i18n-tooltip="str126"
                                     data-json-key="bgColor"
                                     data-tooltip="Color del fondo"
                                     data-type="color"
                                     id="mrc-color-bg">
                                </div>
                            </div>
                        </div>

                                <div class="cc-multi-btn"
                                     data-function="openSinglePicker"
                                     data-function-arg1="marquee-position"
                                     data-i18n-tooltip="str127"
                                     data-json-key="position"
                                     data-tooltip="Posición"
                                     data-type="single-picker"
                                     id="mrc-position">
                                    <span class="cc-multi-btn-label"></span>
                                    <i class="cc-multi-btn-chevron" data-lucide="chevron-down"></i>
                                </div>
                                <div class="cc-multi-btn"
                                     data-function="openSinglePicker"
                                     data-function-arg1="marquee-duration-mode"

                                     data-json-key="durationMode"
                                     data-tooltip="Modo de duración"
                                     data-type="single-picker"
                                     id="mrc-duration-mode">

                                       data-type="number"
                                       id="mrc-speed"
                                       max="300"
                                       min="5"
                                       step="5"
                                       style="width:60px;"
                                       type="number" />
                                <div class="cc-multi-btn"

                                     data-function-arg1="marquee-animation"
                                     data-i18n-tooltip="str131"
                                     data-json-key="animation"
                                     data-tooltip="Animación de transición"
                                     data-type="single-picker"
                                     id="mrc-animation">
                                    <span class="cc-multi-btn-label"></span>
                                    <i class="cc-multi-btn-chevron" data-lucide="chevron-down"></i>
                                </div>
                            </div>
                        </div>

                        <div class="cc-section">

                                </div>
                            </div>
                        </div>

                        <div class="cc-section">
                            <div class="cc-section-title" data-i18n="str88">Marquesinas</div>

                <div class="modal-footer modal-footer-right">
                    <div class="code-btn code-btn-cancel" data-function="closeModal" data-function-arg1="configurar-marquesina">

                    </div>
                </div>
